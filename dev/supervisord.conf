[supervisord]
nodaemon = true
logfile = /var/lib/pylai/log/supervisord.log
logfile_maxbytes = 0
loglevel = error
pidfile = /run/supervisord.pid
user = root

# 各程序 stdout/stderr 转发到容器 stdout/stderr（/dev/fd/1、/dev/fd/2），
# 使 docker logs / start-dev.py 实时可见后端日志；maxbytes=0 禁用轮转（字符设备不轮转）。
[program:backend]
# --TestMode：开发容器内不实际发送邮件，验证码（注册/绑定邮箱/密码重置）直接输出到控制台日志
command = /opt/pylai/Pylaios serve --TestMode --config /var/lib/pylai/pylai.toml
directory = /opt/pylai
user = pylai
autorestart = true
environment = ASPNETCORE_ENVIRONMENT="Development",HOME="/var/lib/pylai"
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
stdout_logfile_backups = 0
stderr_logfile = /dev/fd/2
stderr_logfile_maxbytes = 0
stderr_logfile_backups = 0

[program:redis]
command = redis-server /var/lib/pylai/redis.conf --loglevel warning
user = redis
autorestart = true
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
stdout_logfile_backups = 0
stderr_logfile = /dev/fd/2
stderr_logfile_maxbytes = 0
stderr_logfile_backups = 0

[program:nginx]
command = /bin/sh -c 'exec /usr/sbin/nginx -c /etc/nginx/sites-available/pylai-dev -g "daemon off;" 2>/dev/null'
user = root
autorestart = true
stdout_logfile = /dev/null
stderr_logfile = /dev/null
