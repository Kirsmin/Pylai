server {
    listen 80 default_server;
    server_name _;

    root /opt/pylai/ui;
    index index.html;

    # 字体 MIME：默认 mime.types 缺少 ttf，浏览器（Firefox 等）会拒绝加载 @font-face 字体
    include /etc/nginx/mime.types;
    types {
        font/ttf ttf;
    }

    # AdminUI（Pylai 管理台）：同源 /admin/ 子路径，独立 SPA fallback。
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /opt/pylai/adminui/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /connect/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $http_host;
    }

    location /.well-known/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
