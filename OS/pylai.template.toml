[Logging]
DefaultLevel = "Information"
MicrosoftAspNetCoreLevel = "Warning"
PylaiosLevel = "Information"

[TokenCleanup]
Enabled = true

[LoginRateLimit]
MaxFailuresPerIp = 10
BanDurationMinutes = [15, 60, 1440, -1]
CooldownDays = 3

[AdminRateLimit]
MaxFailuresFirstBan = 5
FirstBanDurationSeconds = 30
MaxFailuresSecondBan = 20
SecondBanDurationHours = 24

[InviteCode]
ServerPepper = "${server_pepper}"
MaxFailuresPerIp = 20
BanDurationHours = 48
EmailCodeBanDurationHours = 24
UsernameCheckMaxPerHourPerIp = 100
MaxRedemptions = 10
DefaultLifetimeHours = 168
RequireInviteCode = false

[Seeds.DefaultAdmin]
Email = "${seed_admin_email}"
Password = "${seed_admin_password}"
DisplayName = "${seed_admin_display_name}"

[Seeds.DefaultUser]
Email = "${seed_user_email}"
Password = "${seed_user_password}"
DisplayName = "${seed_user_display_name}"

[Seeds.DefaultMax]
Email = "${seed_max_email}"
Password = "${seed_max_password}"
DisplayName = "${seed_max_display_name}"

[UserToken]
DefaultLifetimeDays = 60

[ConfirmationRateLimit]
MaxFailures = 10
BanDurationHours = 24

[Mfa]
RelyingPartyId = "${relying_party_id}"
RelyingPartyName = "Pylaios"
Origins = ${mfa_origins}
ChallengeLifetimeMinutes = 5
RequireForAdmin = ${mfa_require_for_admin}
RequireWebAuthnForMax = ${mfa_require_webauthn_for_max}
