# =============================================================================
# Pylaios 配置文件（单文件，全部配置集中于此）
# 复制为 pylai.toml 后填写本机值；仓库内此模板不包含任何秘密。
# 社区反馈可执行 `Pylaios config export` 生成脱敏配置（敏感字段留空）。
# =============================================================================

# 服务器基础配置
[Server]
Url = "http://localhost:5000"
MaxRequestBodyMB = 2
# 允许访问的 Host 白名单；生产环境必须列出明确域名/IP，禁止 "*"
AllowedHosts = ["localhost", "127.0.0.1"]

# CORS 跨域资源共享
[Cors]
Enabled = true
AllowedOrigins = ["http://localhost:5173"]
AllowedMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
AllowedHeaders = ["Content-Type", "Authorization", "X-Requested-With", "Accept", "Origin"]
AllowCredentials = true

# 前端地址
[Frontend]
Url = "http://localhost:5173"

# IP 解析 — 可信代理与白名单
[IpResolution]
TrustedProxies = ["127.0.0.1", "::1"]
TrustedHeaders = ["X-Forwarded-For", "X-Forwarded-Proto", "X-Forwarded-Host"]
IpWhitelist = []
# Forwarded Headers — 启用后由 UseForwardedHeaders 处理 X-Forwarded-For / X-Forwarded-Proto，
# 反代（Nginx 等）后 Scheme/RemoteIpAddress 自动修正（TLS 终止由 Nginx 完成，后端不处理 HTTPS）。
# TrustedProxies / TrustedNetworks(CIDR) 指明哪些来源的转发头可信，务必只填代理服务器地址。
ForwardedHeadersEnabled = true
TrustedNetworks = []

# 数据库连接（仅支持 PostgreSQL；密码直接存本文件，请勿提交仓库）
[Database]
ConnectionString = "Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password="

# Redis 缓存 — 限流/封禁状态缓存层
[Redis]
Host = "127.0.0.1"
Port = 6379
Password = ""
Database = 0
ConnectTimeoutMs = 5000

# 数据库备份目录（backup 命令产物，pg_dump 快照）
[Backup]
Directory = "backups"

# ASP.NET Core Identity 密码策略
# 邮件验证码有效期（分钟）：注册/密码重置/邮箱绑定统一使用，邮件模板 %%ExpireMinutes%% 同步渲染
[Identity]
EmailCodeExpireMinutes = 10

[Identity.Password]
RequiredLength = 12
AdminRequiredLength = 14
CheckBreachedPasswords = true
RequireDigit = true
RequireLowercase = false
RequireUppercase = false
RequireNonAlphanumeric = false

[Identity.Lockout]
DefaultTimeoutMinutes = 5
MaxFailedAttempts = 5

# 认证 Cookie
[Cookie]
Name = "Pylaios.Auth"
# 会话追踪 Cookie（登录时生成，哈希存 UserSessions 表）
SessionName = "Pylaios.Session"
HttpOnly = true
SameSite = "Lax"
SecurePolicy = "Always"
ExpireDays = 14
SlidingExpiration = true

[DataProtection]
# 生产环境必须使用持久化目录，不能依赖临时密钥环
KeyDirectory = "/var/lib/pylai/dataprotection"

[Deployment]
BundledNginx = true

# OpenIddict OAuth2 + OpenID Connect
# 传输安全要求：生产默认强制 HTTPS；纯内网 HTTP 部署可设 RequireHttps = false
[OpenIddict]
# 固定 Issuer（与外部访问地址一致）；生产环境必须配置
Issuer = "http://localhost:5000"
RequireHttps = true

[OpenIddict.AccessToken]
LifetimeHours = 1
DisableEncryption = false

[OpenIddict.RefreshToken]
LifetimeDays = 7

[OpenIddict.IdentityToken]
LifetimeHours = 1

[OpenIddict.Endpoints]
Authorize = "/connect/authorize"
Token = "/connect/token"
UserInfo = "/connect/userinfo"
Introspect = "/connect/introspect"
EndSession = "/connect/logout"

[OpenIddict.Grants]
AuthorizationCode = true
RefreshToken = true
ClientCredentials = true

[OpenIddict.Scopes]
openId = true
profileBasic = true
profileMail = true
profileRole = true
offlineAccess = true

[OpenIddict.Certificates.Signing]
# 留空时从数据库 SigningKeys 读取；首次安装请执行 `Pylaios key rotate --if-empty`
Path = ""
Password = ""

[OpenIddict.Certificates.Encryption]
Path = ""
Password = ""

[OpenIddict.SigningKeyEncryption]
# 只保存 AES-GCM KEK 文件路径；KEK 不得存入数据库或配置仓库
KeyFile = ""

# 外部登录（AppId/ClientSecret 留空即禁用）
[ExternalLogin.Facebook]
AppId = ""
AppSecret = ""

[ExternalLogin.Microsoft]
ClientId = ""
ClientSecret = ""

[ExternalLogin.Github]
ClientId = ""
ClientSecret = ""

# 邮件发送（SMTP）
[Email]
FromName = "Pylaios"
FromAddress = ""

[Email.Smtp]
Host = ""
Port = 587
# Security: None / StartTls / SslOnConnect
# 常见组合：465 -> SslOnConnect（SMTPS/隐式 TLS）；587 -> StartTls；25 -> None
Security = "StartTls"
Username = ""
Password = ""

# 邮件主题与正文模板（四种场景）
# 占位符（%% 开头结尾）：%%CaptchaCode%%（必填） / %%Browser%% / %%IPAddress%% / %%ExpireMinutes%%（可选）
[MailTheme.Register]
Title = "注册 Pylai！"
Context = '''
你正在网页端注册 Pylai 通行证，请仔细核查以下信息，然后输入验证码：

浏览器：%%Browser%%
IP地址：%%IPAddress%%

你的验证码是：%%CaptchaCode%%
验证码 %%ExpireMinutes%% 分钟内有效，过期后请重新获取。

Kirsmax(Bot),
Poeat Team.

------
此邮件由系统自动生成并发送，如果不是本人操作，可以选择：
- 忽略邮件，可能是有人输入了错误的电子邮件地址。
- 如果频繁收到此邮件，请联系管理员。
'''

[MailTheme.Bind]
Title = "绑定邮箱"
Context = '''
你正在网页端为 Pylai 通行证绑定邮箱，请仔细核查以下信息，然后输入验证码：

浏览器：%%Browser%%
IP地址：%%IPAddress%%

你的验证码是：%%CaptchaCode%%
验证码 %%ExpireMinutes%% 分钟内有效，过期后请重新获取。

Kirsmax(Bot),
Poeat Team.

------
此邮件由系统自动生成并发送，如果不是本人操作，可以选择：
- 忽略邮件，可能是有人输入了错误的电子邮件地址。
- 如果频繁收到此邮件，请联系管理员。
'''

[MailTheme.Change]
Title = "更换邮箱"
Context = '''
你正在网页端更换 Pylai 通行证的邮箱，请仔细核查以下信息，然后输入验证码：

浏览器：%%Browser%%
IP地址：%%IPAddress%%

你的验证码是：%%CaptchaCode%%
验证码 %%ExpireMinutes%% 分钟内有效，过期后请重新获取。

Kirsmax(Bot),
Poeat Team.

------
此邮件由系统自动生成并发送，如果不是本人操作，可以选择：
- 忽略邮件，可能是有人输入了错误的电子邮件地址。
- 如果频繁收到此邮件，请联系管理员。
'''

[MailTheme.PasswordReset]
Title = "密码重置"
Context = '''
你正在网页端重置 Pylai 通行证的密码，请仔细核查以下信息，然后输入验证码：

浏览器：%%Browser%%
IP地址：%%IPAddress%%

你的验证码是：%%CaptchaCode%%
验证码 %%ExpireMinutes%% 分钟内有效，过期后请重新获取。

Kirsmax(Bot),
Poeat Team.

------
此邮件由系统自动生成并发送，如果不是本人操作，可以选择：
- 忽略邮件，可能是有人输入了错误的电子邮件地址。
- 如果频繁收到此邮件，请联系管理员。
