# 日志级别（生产默认 Information；排障时临时调高 Debug/Trace，勿长期开启——
# Debug 及以下会记录 UID、邮箱、IP 等认证流程元数据）
[Logging]
DefaultLevel = "Information"
MicrosoftAspNetCoreLevel = "Warning"
PylaiosLevel = "Information"

# Token 清理（OpenIddict Quartz 后台任务，定期清除过期 token）
[TokenCleanup]
Enabled = true

# IP 登录限流 — 超过阈值后 IP 被临时封禁
[LoginRateLimit]
MaxFailuresPerIp = 10
BanDurationMinutes = [15, 60, 1440, -1]
CooldownDays = 3

# 管理 API 限流 — UserToken/OAuth 认证失败
[AdminRateLimit]
MaxFailuresFirstBan = 5
FirstBanDurationSeconds = 30
MaxFailuresSecondBan = 20
SecondBanDurationHours = 24

# 邀请码（提权）— 由管理 API/CLI 生成，db seed 绝不创建邀请码
[InviteCode]
ServerPepper = ""
MaxFailuresPerIp = 20
BanDurationHours = 48
EmailCodeBanDurationHours = 24
UsernameCheckMaxPerHourPerIp = 100
# 普通邀请码的默认最大核销次数
MaxRedemptions = 10
DefaultLifetimeHours = 168

# 种子数据（db seed 执行；密码为空的种子用户不会被创建，避免空密码账户）
[Seeds.DefaultAdmin]
Email = "admin@pylaios.local"
Password = ""
DisplayName = "Administrator"

[Seeds.DefaultUser]
Email = "user@pylaios.local"
Password = ""
DisplayName = "Test User"

[Seeds.DefaultMax]
Email = "max@pylaios.local"
Password = ""
DisplayName = "Max User"

# UserToken — 用户个人 API Token
[UserToken]
# 默认有效期（天），0 表示永不过期
DefaultLifetimeDays = 60

# 特殊功能密码二次验证失败封禁（账号级，1 天）
[ConfirmationRateLimit]
MaxFailures = 10
BanDurationHours = 24

# 高权限账户 MFA
# 注意：WebAuthn / Passkey 仅在安全上下文（HTTPS 或 localhost）可用。
# HTTP/局域网 IP 部署时，Max 强制 WebAuthn 会导致无法登录，请关闭 RequireWebAuthnForMax。
[Mfa]
RelyingPartyId = "localhost"
RelyingPartyName = "Pylaios"
Origins = ["http://localhost:5173"]
ChallengeLifetimeMinutes = 5
# Admin 及以上角色登录时是否强制要求 MFA（默认关闭，生产环境建议开启）
RequireForAdmin = false
# Max 角色是否强制使用 WebAuthn（需 HTTPS 环境；HTTP/局域网部署请关闭）
RequireWebAuthnForMax = false
