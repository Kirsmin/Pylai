name: Build and Release Pylai

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.0.1 或 v0.0.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref }}-${{ inputs.version || github.ref_name }}"
  cancel-in-progress: false

jobs:
  # ═════════════════════════════════════════════════════════════════
  # Job 0: 完整 CI 门禁（Reusable Workflow）
  #   发布步骤被 needs 强制依赖本 job —— 发布成功 ⇔ CI 全绿
  #   （构建 + 配置校验 + 安全回归 + 冒烟 + 登录验证全部通过）
  # ═════════════════════════════════════════════════════════════════
  ci:
    name: CI Gate（完整测试门禁）
    uses: ./.github/workflows/ci.yml

  # ═════════════════════════════════════════════════════════════════
  # Job 1: 双架构并行构建（AMD64 附带冒烟测试，与 ARM64 构建同时进行）
  # ═════════════════════════════════════════════════════════════════
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux-amd64, linux-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.0"

      - name: Setup QEMU
        if: matrix.target == 'linux-arm64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build release package
        run: |
          python scripts/release.py \
            --version "${{ steps.version.outputs.version }}" \
            --target "${{ matrix.target }}"

      - name: Verify image templates（Fail Closed）
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAR="dist/Pylai-${VERSION}-Linux-${{ matrix.target == 'linux-amd64' && 'AMD64' || 'ARM64' }}.tar"
          # 统一以 tar 字节搜索校验（不依赖镜像是否已 load，ARM64 亦适用）
          if ! python3 -c "import pathlib; data=pathlib.Path('$TAR').read_bytes(); assert b'pylai.template.toml' in data and b'server_url' in data, 'missing template'; assert b'pylai.example.toml' in data, 'missing example'; print('tar 模板校验通过')"; then
            echo "tar 模板校验失败"; exit 1
          fi
          # AMD64 额外在已 load 镜像内二次校验
          if [[ "${{ matrix.target }}" == "linux-amd64" ]]; then
            docker load < "$TAR" >/dev/null
            docker run --rm --entrypoint cat "pylaios:${VERSION}-AMD64" /opt/pylai/pylai.template.toml | grep -q "server_url" || { echo "缺失 template"; exit 1; }
            docker run --rm --entrypoint cat "pylaios:${VERSION}-AMD64" /opt/pylai/pylai.example.toml | grep -q "\[Server\]" || { echo "缺失 example"; exit 1; }
            echo "==> AMD64 镜像内校验通过"
          else
            echo "==> ARM64 tar 结构校验通过（完整镜像内校验待 finalize）"
          fi

      - name: Smoke test AMD64 image（read-only + cap-drop）
        if: matrix.target == 'linux-amd64'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          docker load < "dist/Pylai-${VERSION}-Linux-AMD64.tar"

          SMOKE=/tmp/pylai-smoke
          mkdir -p "$SMOKE/config/certs" "$SMOKE/data" "$SMOKE/pg"
          chmod 777 "$SMOKE/pg"
          docker create --name pylai-smoke-template "pylaios:${VERSION}-AMD64" >/dev/null
          docker cp pylai-smoke-template:/opt/pylai/pylai.example.toml "$SMOKE/config/pylai.toml"
          docker rm pylai-smoke-template >/dev/null

          openssl rand -hex 32 > "$SMOKE/config/certs/signing-kek"
          chmod 600 "$SMOKE/config/certs/signing-kek"
          SMOKE_PEPPER=$(openssl rand -hex 32)
          SMOKE_PFX_PASS=$(openssl rand -hex 16)
          SMOKE_DB_PASS=$(openssl rand -hex 16)
          SMOKE_REDIS_PASS=$(openssl rand -hex 16)
          export SMOKE_PEPPER SMOKE_PFX_PASS SMOKE_DB_PASS SMOKE_REDIS_PASS
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -subj "/CN=Pylai Release Smoke" \
            -keyout "$SMOKE/config/certs/encryption-key.pem" \
            -out "$SMOKE/config/certs/encryption-cert.pem" >/dev/null 2>&1
          openssl pkcs12 -export -out "$SMOKE/config/certs/encryption.pfx" \
            -inkey "$SMOKE/config/certs/encryption-key.pem" \
            -in "$SMOKE/config/certs/encryption-cert.pem" \
            -passout "pass:${SMOKE_PFX_PASS}" >/dev/null 2>&1

          python3 - <<'PYGEN'
          import os
          from pathlib import Path
          p = Path('/tmp/pylai-smoke/config/pylai.toml')
          text = p.read_text()
          text = text.replace('Url = "http://localhost:5000"', 'Url = "http://0.0.0.0:5000"', 1)
          text = text.replace('Url = "http://localhost:5173"', 'Url = "http://localhost:18080"', 1)
          text = text.replace('Issuer = "http://localhost:5000"', 'Issuer = "http://localhost:18080"', 1)
          text = text.replace('ServerPepper = ""', f'ServerPepper = "{os.environ["SMOKE_PEPPER"]}"', 1)
          text = text.replace('KeyFile = ""', 'KeyFile = "/etc/pylai/certs/signing-kek"', 1)
          text = text.replace('[OpenIddict.Certificates.Encryption]\nPath = ""',
                              '[OpenIddict.Certificates.Encryption]\nPath = "/etc/pylai/certs/encryption.pfx"', 1)
          text = text.replace('Path = "/etc/pylai/certs/encryption.pfx"\nPassword = ""',
                              f'Path = "/etc/pylai/certs/encryption.pfx"\nPassword = "{os.environ["SMOKE_PFX_PASS"]}"', 1)
          text = text.replace('ConnectionString = "Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password="',
                              f'ConnectionString = "Host=127.0.0.1;Port=5432;Database=pylai;Username=pylai;Password={os.environ["SMOKE_DB_PASS"]}"', 1)
          text = text.replace('[Redis]\nHost = "127.0.0.1"\nPort = 6379\nPassword = ""',
                              f'[Redis]\nHost = "127.0.0.1"\nPort = 6379\nPassword = "{os.environ["SMOKE_REDIS_PASS"]}"', 1)
          text = text.replace('RequireHttps = true', 'RequireHttps = false', 1)
          text = text.replace('SecurePolicy = "Always"', 'SecurePolicy = "SameAsRequest"', 1)
          text = text.replace('AllowedOrigins = ["http://localhost:5173"]', 'AllowedOrigins = ["http://localhost:18080"]', 1)
          p.write_text(text)
          PYGEN

          docker run -d --name pylai-release-smoke -p 18080:80 \
            --read-only \
            --cap-drop ALL \
            --cap-add CHOWN \
            --cap-add DAC_OVERRIDE \
            --cap-add FOWNER \
            --cap-add SETGID \
            --cap-add SETUID \
            --cap-add NET_BIND_SERVICE \
            --cap-add KILL \
            --tmpfs /tmp:rw,nosuid,size=64m \
            --tmpfs /run:rw,nosuid,size=16m \
            --security-opt no-new-privileges:true \
            --pids-limit 512 \
            -e PYLAI_ROLE=server \
            -e PYLAI_UI_URL=http://localhost:18080 \
            -e PYLAI_DB_USER=pylai \
            -e "PYLAI_DB_PASSWORD=${SMOKE_DB_PASS}" \
            -e PYLAI_DB_NAME=pylai \
            -e "PYLAI_REDIS_PASSWORD=${SMOKE_REDIS_PASS}" \
            -v "$SMOKE/config:/etc/pylai" \
            -v "$SMOKE/data:/var/lib/pylai" \
            -v "$SMOKE/pg:/var/lib/postgresql" \
            "pylaios:${VERSION}-AMD64"

          for i in $(seq 1 40); do
            sleep 5
            if curl -sf --max-time 5 http://127.0.0.1:18080/health/ready | grep -q '"status":"healthy"'; then
              echo "==> health/ready OK"
              break
            fi
            if [ "$i" = "40" ]; then
              echo "==> smoke 超时"; docker logs pylai-release-smoke 2>&1 | tail -100; exit 1
            fi
          done
          curl -sf --max-time 5 -o /dev/null http://127.0.0.1:18080/ || exit 1
          curl -sf --max-time 5 -o /dev/null http://127.0.0.1:18080/admin/ || exit 1
          # 模板文件存在性断言（冒烟容器内）
          docker exec pylai-release-smoke test -f /opt/pylai/pylai.template.toml || { echo "容器内缺失 template"; exit 1; }
          docker exec pylai-release-smoke test -f /opt/pylai/pylai.example.toml || { echo "容器内缺失 example"; exit 1; }
          docker exec pylai-release-smoke grep -q "server_url" /opt/pylai/pylai.template.toml || { echo "template 内容异常"; exit 1; }

          PID1=$(docker inspect pylai-release-smoke --format '{{.State.Pid}}')
          for needle in "user = pylai" "user = redis"; do
            docker exec pylai-release-smoke sh -c "grep -q '$needle' /etc/supervisor/conf.d/pylai-server.conf" \
              || { echo "缺少 $needle"; docker logs pylai-release-smoke 2>&1 | tail -60; exit 1; }
          done
          if docker exec pylai-release-smoke sh -c "ps -eo user,comm | grep 'Pylaios' | grep -q '^root'"; then
            echo "Backend 进程以 root 运行"; docker exec pylai-release-smoke ps -eo user,pid,comm; exit 1
          fi
          # 验证 ManagePylai 配置生成路径（template 渲染）可用
          docker run --rm --entrypoint /opt/pylai/Pylaios "pylaios:${VERSION}-AMD64" config validate --help >/dev/null 2>&1 || true

          # ═══ 版本一致性断言（Fail Closed）：二进制内部版本必须严格等于发布 Tag ═══
          VERSION_JSON=$(docker run --rm --entrypoint /opt/pylai/Pylaios "pylaios:${VERSION}-AMD64" --version)
          BIN_VERSION=$(printf '%s' "$VERSION_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          if [[ "${BIN_VERSION}" != "${VERSION}" ]]; then
            echo "==> 版本不一致：二进制=${BIN_VERSION}，Tag=${VERSION}"; exit 1
          fi
          echo "==> 版本一致性断言通过（二进制 ${BIN_VERSION} = Tag ${VERSION}）"

          docker rm -f pylai-release-smoke >/dev/null 2>&1
          sudo rm -rf "$SMOKE"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pylai-${{ matrix.target }}
          path: |
            dist/*.tar
            dist/*.tar.sha256
          retention-days: 3
          if-no-files-found: error

  # ═════════════════════════════════════════════════════════════════
  # Job 2: 汇总产物 + 生成清单 + 创建 GitHub Release
  # ═════════════════════════════════════════════════════════════════
  release:
    needs: [build, ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.0"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: pylai-*
          path: dist
          merge-multiple: true

      - name: Finalize release assets（ManagePylai.py + release.json）
        run: |
          python scripts/release.py \
            --version "${{ steps.version.outputs.version }}" \
            --target all \
            --finalize

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists. Refusing to overwrite it." >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            gh release create "${RELEASE_TAG}" \
              dist/*.tar \
              dist/*.tar.sha256 \
              dist/ManagePylai.py \
              dist/ManagePylai.py.sha256 \
              dist/release.json \
              --title "Pylai v${RELEASE_VERSION}" \
              --generate-notes
          else
            gh release create "${RELEASE_TAG}" \
              dist/*.tar \
              dist/*.tar.sha256 \
              dist/ManagePylai.py \
              dist/ManagePylai.py.sha256 \
              dist/release.json \
              --title "Pylai v${RELEASE_VERSION}" \
              --generate-notes \
              --target "${GITHUB_SHA}"
          fi
