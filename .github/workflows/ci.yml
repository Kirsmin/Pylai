name: CI — 构建 + Dev 镜像

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ═════════════════════════════════════════════════════════════════
  # Job 1: 后端构建 + 配置校验（与前端并行）
  # ═════════════════════════════════════════════════════════════════
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14.0"

      - name: Build backend
        working-directory: OS
        run: dotnet build Pylaios.csproj -c Release

      - name: Config validate（生产安全配置 + DataProtection KEK）
        working-directory: OS
        run: |
          set -euo pipefail
          cp pylai.example.toml /tmp/pylai-valid.toml
          printf '%064d' 1 > /tmp/pylai-signing-kek
          openssl rand 32 > /tmp/pylai-dp-kek
          export PYLAI_DP_KEK_FILE=/tmp/pylai-dp-kek
          CI_PEPPER=$(openssl rand -hex 32)
          CI_PFX_PASS=$(openssl rand -hex 16)
          export CI_PEPPER CI_PFX_PASS
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -subj "/CN=Pylai CI Encryption" \
            -keyout /tmp/pylai-encryption-key.pem -out /tmp/pylai-encryption-cert.pem >/dev/null 2>&1
          openssl pkcs12 -export -out /tmp/pylai-encryption.pfx \
            -inkey /tmp/pylai-encryption-key.pem -in /tmp/pylai-encryption-cert.pem \
            -passout "pass:${CI_PFX_PASS}" >/dev/null 2>&1
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('/tmp/pylai-valid.toml')
          text = p.read_text()
          text = text.replace('ServerPepper = ""', f'ServerPepper = "{os.environ["CI_PEPPER"]}"', 1)
          text = text.replace('KeyFile = ""', 'KeyFile = "/tmp/pylai-signing-kek"', 1)
          text = text.replace('Issuer = "http://localhost:5000"', 'Issuer = "https://localhost:5000"', 1)
          text = text.replace('[OpenIddict.Certificates.Encryption]\nPath = ""',
                              '[OpenIddict.Certificates.Encryption]\nPath = "/tmp/pylai-encryption.pfx"', 1)
          text = text.replace('Path = "/tmp/pylai-encryption.pfx"\nPassword = ""',
                              f'Path = "/tmp/pylai-encryption.pfx"\nPassword = "{os.environ["CI_PFX_PASS"]}"', 1)
          p.write_text(text)
          PY
          dotnet bin/Release/net10.0/Pylaios.dll config validate --config /tmp/pylai-valid.toml

      - name: Security negative config checks
        working-directory: OS
        run: |
          set -euo pipefail
          assert_invalid() {
            local label="$1"
            local needle="$2"
            shift 2
            if dotnet bin/Release/net10.0/Pylaios.dll config validate --config /tmp/pylai-negative.toml >/tmp/negative.json 2>&1; then
              echo "${label} 仍通过校验"; cat /tmp/negative.json; exit 1
            fi
            grep -q "${needle}" /tmp/negative.json || {
              echo "${label} 未返回预期错误 ${needle}"; cat /tmp/negative.json; exit 1
            }
          }
          cp /tmp/pylai-valid.toml /tmp/pylai-negative.toml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/pylai-negative.toml')
          text = p.read_text()
          import re
          text = re.sub(r'^ServerPepper = ".*"$', 'ServerPepper = ""', text, count=1, flags=re.M)
          p.write_text(text)
          PY
          assert_invalid "缺失 InviteCode.ServerPepper" "InviteCode.ServerPepper"

          cp /tmp/pylai-valid.toml /tmp/pylai-negative.toml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/pylai-negative.toml')
          text = p.read_text().replace('KeyFile = "/tmp/pylai-signing-kek"', 'KeyFile = ""', 1)
          p.write_text(text)
          PY
          assert_invalid "缺失签名 KEK" "SigningKeyEncryption.KeyFile"

          cp /tmp/pylai-valid.toml /tmp/pylai-negative.toml
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('/tmp/pylai-negative.toml')
          text = p.read_text()
          text = re.sub(r'^Path = "/tmp/pylai-encryption.pfx"$', 'Path = ""', text, count=1, flags=re.M)
          text = re.sub(r'^Password = ".*"$', 'Password = ""', text, count=1, flags=re.M)
          p.write_text(text)
          PY
          assert_invalid "缺失 OpenIddict 加密证书" "OpenIddict.Certificates.Encryption.Path"

      - name: .NET dependency vulnerability scan
        run: dotnet list OS/Pylaios.csproj package --vulnerable --include-transitive

  # ═════════════════════════════════════════════════════════════════
  # Job 2: 前端构建 + 依赖审计（与后端并行）
  # ═════════════════════════════════════════════════════════════════
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.15.1"
          run_install: false

      - name: Build UI
        working-directory: UI
        run: |
          pnpm install --frozen-lockfile
          VITE_SUPPORT_EMAIL="ci@pylaios.local" pnpm build

      - name: Build AdminUI
        working-directory: AdminUI
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Frontend dependency vulnerability scan
        run: |
          set -euo pipefail
          pnpm --dir UI audit --audit-level high
          pnpm --dir AdminUI audit --audit-level high

  # ═════════════════════════════════════════════════════════════════
  # Job 3: Docker 构建 + 容器加固 + Smoke Test（依赖前两个 Job）
  # ═════════════════════════════════════════════════════════════════
  build-docker-and-test:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14.0"

      - name: Build Dev Docker image (linux/amd64)
        run: |
          docker buildx build --platform linux/amd64 \
            -t pylai-dev:latest \
            --load .

      - name: Save Docker image
        run: docker save pylai-dev:latest -o pylai-dev-amd64.tar

      - name: Upload Dev image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pylai-dev-amd64
          path: pylai-dev-amd64.tar
          retention-days: 14

      - name: Container hardening checks
        run: |
          set -euo pipefail
          docker image inspect pylai-dev:latest --format '{{json .Config.ExposedPorts}}' | grep -q '80' || exit 1
          docker run --rm --entrypoint sh pylai-dev:latest -c '
            set -e
            grep -q "user = pylai" /etc/supervisor/conf.d/pylai.conf
            grep -q "user = redis" /etc/supervisor/conf.d/pylai.conf
            grep -q "user = pylai" /etc/supervisor/conf.d/pylai-server.conf
            grep -q "user = redis" /etc/supervisor/conf.d/pylai-server.conf
            grep -q "^user www-data;" /etc/nginx/sites-available/pylai-dev
            grep -q "^user www-data;" /etc/nginx/sites-available/pylai-server
            grep -q "Content-Security-Policy" /etc/nginx/sites-available/pylai-server
            ! grep -q "unsafe-eval" /etc/nginx/sites-available/pylai-server
            ! grep -q "script-src 'self' 'unsafe-inline'" /etc/nginx/sites-available/pylai-server
            ! grep -q "script-src-elem 'unsafe-inline'" /etc/nginx/sites-available/pylai-server
          '

      - name: Smoke test — 完整实例启动 + 健康检查 + MFA 门禁 + 并发注册
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8080:80 -e PYLAI_ROLE=dev -e PYL_UI_URL=http://localhost:8080 pylai-dev:latest

          for i in $(seq 1 30); do
            sleep 5
            if curl -sf --max-time 5 http://localhost:8080/health/ready | grep -q '"status":"healthy"'; then
              echo "==> health/ready OK"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "==> 等待就绪超时"; docker logs smoke 2>&1 | tail -40; exit 1
            fi
          done

          curl -sf --max-time 5 -o /dev/null http://localhost:8080/ || { echo "UI 不可访问"; exit 1; }

          SECRETS=$(docker exec smoke cat /var/lib/pylai/.secrets)
          USER_PW=$(awk -F= '/^USER_PASSWORD=/{gsub(/'"'"'/,"",$2); print $2; exit}' <<< "$SECRETS")
          ADMIN_PW=$(awk -F= '/^ADMIN_PASSWORD=/{gsub(/'"'"'/,"",$2); print $2; exit}' <<< "$SECRETS")
          [ -n "$USER_PW" ] && [ -n "$ADMIN_PW" ] || { echo "==> 无法从 .secrets 读取凭据"; exit 1; }

          # 新 API 格式：成功返回 200 + { uid, ... }，不再包含 success 字段
          NORMAL_LOGIN=$(curl -sf --max-time 20 -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"usernameOrEmail\":\"user@pylaios.local\",\"password\":\"$USER_PW\"}")
          echo "$NORMAL_LOGIN" | grep -q '"uid"' || { echo "普通用户登录失败"; echo "$NORMAL_LOGIN"; exit 1; }

          # Admin 登录应被 MFA 门禁拦截（返回 422 + errorCode）
          ADMIN_LOGIN=$(curl -s --max-time 20 -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"usernameOrEmail\":\"admin@pylaios.local\",\"password\":\"$ADMIN_PW\"}")
          echo "$ADMIN_LOGIN" | grep -q '"errorCode":"mfa_required"\|"errorCode":"mfa_setup_required"' \
            || { echo "Admin 未受 MFA 门禁保护"; echo "$ADMIN_LOGIN"; exit 1; }
          echo "==> MFA 登录门禁 OK"

          python3 scripts/security-regression.py --base-url http://localhost:8080 --container smoke

          docker rm -f smoke >/dev/null 2>&1
