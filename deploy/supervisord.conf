[supervisord]
nodaemon = true
logfile = /var/log/pylai/supervisord.log
pidfile = /var/run/supervisord.pid
user = root

[program:backend]
command = /opt/pylai/Pylaios serve --config /etc/pylai/pylai.toml
directory = /opt/pylai
user = root
autorestart = true
environment = ASPNETCORE_ENVIRONMENT="Production",PYLAI_DATA_DIR="/var/lib/pylai/dataprotection"
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
stdout_logfile_backups = 0
stderr_logfile = /dev/fd/2
stderr_logfile_maxbytes = 0
stderr_logfile_backups = 0

[program:redis]
command = redis-server /etc/redis/pylai.conf
user = root
autorestart = true
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
stdout_logfile_backups = 0
stderr_logfile = /dev/fd/2
stderr_logfile_maxbytes = 0
stderr_logfile_backups = 0

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
user = root
autorestart = true
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
stdout_logfile_backups = 0
stderr_logfile = /dev/fd/2
stderr_logfile_maxbytes = 0
stderr_logfile_backups = 0
