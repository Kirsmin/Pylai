user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log stderr warn;

events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    # 字体 MIME：默认 mime.types 缺少 ttf，浏览器（Firefox 等）会拒绝加载 @font-face 字体。
    # 必须在 http 级追加（同上下文 types 合并），server/location 级 types 会整体替换继承映射。
    types {
        font/ttf ttf;
    }
    default_type application/octet-stream;
    sendfile on;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    access_log off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    server {
    listen 80 default_server;
    server_name _;

    root /opt/pylai/ui;
    index index.html;
    client_max_body_size 2m;

    # AdminUI（Pylai 管理台）：同源 /admin/ 子路径，独立 SPA fallback。
    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /opt/pylai/adminui/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /connect/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $http_host;
    }
    location /.well-known/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location / { try_files $uri $uri/ /index.html; }
}
}
